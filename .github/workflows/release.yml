name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DRY_RUN: "true"

jobs:
  verify-tag:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: v
        run: |
          version="$(./bin/version.sh)"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "$DRY_RUN" != "true" ] && [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match Cargo.toml version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  deps:
    needs: verify-tag
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: bin/deps
          key: deps-${{ runner.os }}-${{ hashFiles('bin/build-opus.sh', 'bin/build-abseil.sh') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: r26d

      - if: steps.cache.outputs.cache-hit != 'true'
        run: brew install ninja llvm

      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install xwin --locked

      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          ./bin/build-opus.sh
          ./bin/build-abseil.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deps
          path: bin/deps
          retention-days: 1

  macos:
    needs: [verify-tag, deps]
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deps
          path: bin/deps

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: brew install meson ninja
      - run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p keys
          printf '%s' "$KEY" > keys/publishing.key
          printf '%s' "$KEY_PWD" > keys/publishing.key.pwd

      - run: cd kursal-tauri && bun install --frozen-lockfile && bun run build
      - run: ./bin/build-mac.sh

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            build/Kursal.dmg
            build/Kursal_x64.dmg
            build/Kursal.app.tar.gz
            build/Kursal_x64.app.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-macos
          path: build/Kursal*

  windows:
    needs: [verify-tag, deps]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deps
          path: bin/deps

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: windows
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: cargo install tauri-cli --version "^2.0.0" --locked

      - run: cd kursal-tauri && bun install --frozen-lockfile && bun run build

      - name: Build
        working-directory: kursal-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPUS_NO_PKG: 1
          OPUS_STATIC: 1
        run: |
          export OPUS_LIB_DIR="$GITHUB_WORKSPACE/bin/deps/win"
          cargo tauri build --bundles nsis,updater \
            --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect
        run: |
          mkdir -p build
          cp target/release/kursal.exe                             build/Kursal_x64.exe
          cp target/release/bundle/nsis/Kursal_*_x64-setup.exe     build/Kursal_x64-setup.exe
          cp target/release/bundle/nsis/Kursal_*_x64-setup.exe.sig build/Kursal_x64-setup.exe.sig

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            build/Kursal_x64.exe
            build/Kursal_x64-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-windows
          path: build/Kursal*

  linux:
    needs: verify-tag
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: x64
          - runner: ubuntu-22.04-arm
            suffix: arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: linux-${{ matrix.suffix }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file unzip \
            libssl-dev pkg-config libasound2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            fuse libfuse2 squashfs-tools ninja-build python3-pip \
            protobuf-compiler xdg-utils libclang-dev clang \
            autoconf automake libtool libopus-dev cmake rpm
          sudo pip3 install --upgrade meson

      - run: cargo install tauri-cli --version "^2.0.0" --locked
      - run: cd kursal-tauri && bun install --frozen-lockfile && bun run build

      - name: Build
        working-directory: kursal-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          cargo tauri build --bundles deb,rpm,appimage,updater \
            --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect
        env:
          S: ${{ matrix.suffix }}
        run: |
          mkdir -p build
          cp target/release/bundle/deb/*.deb               "build/Kursal_$S.deb"
          cp target/release/bundle/deb/*.deb.sig           "build/Kursal_$S.deb.sig"
          cp target/release/bundle/rpm/*.rpm               "build/Kursal_$S.rpm"
          cp target/release/bundle/rpm/*.rpm.sig           "build/Kursal_$S.rpm.sig"
          cp target/release/bundle/appimage/*.AppImage     "build/Kursal_$S.AppImage"
          cp target/release/bundle/appimage/*.AppImage.sig "build/Kursal_$S.AppImage.sig"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            build/Kursal_${{ matrix.suffix }}.deb
            build/Kursal_${{ matrix.suffix }}.rpm
            build/Kursal_${{ matrix.suffix }}.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-linux-${{ matrix.suffix }}
          path: build/Kursal*

  android:
    needs: [verify-tag, deps]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deps
          path: bin/deps

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: android
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Signing keys
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JKS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          JKS_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keys
          printf '%s' "$KEY" > keys/publishing.key
          printf '%s' "$KEY_PWD" > keys/publishing.key.pwd
          echo "$JKS" | base64 -d > keys/android.jks
          printf 'storeFile=%s/keys/android.jks\npassword="%s"\nkeyAlias=upload\n' \
            "$GITHUB_WORKSPACE" "$JKS_PWD" \
            > kursal-tauri/src-tauri/gen/android/keystore.properties

      - run: cd kursal-tauri && bun install --frozen-lockfile && bun run build

      - name: Build
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./bin/build-android.sh

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/Kursal.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-android
          path: build/Kursal*

  relay:
    needs: verify-tag
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          if [ "$DRY_RUN" = "true" ]; then
            ./bin/build-relay.sh
          else
            ./bin/build-relay.sh --push
          fi

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/kursal-relay-*.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-relay
          path: dist/kursal-relay-*

  # Everything is built; now assemble latest.json + SHA256SUMS and publish.
  release:
    needs: [verify-tag, macos, windows, linux, android, relay]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0 # git-cliff needs full history for release notes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: build
          pattern: artifacts-*
          merge-multiple: true

      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: git-cliff

      - name: Signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p keys
          printf '%s' "$KEY" > keys/publishing.key
          printf '%s' "$KEY_PWD" > keys/publishing.key.pwd

      - run: ./bin/gen-manifest.sh
      - run: ./bin/preflight.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manifest
          path: |
            build/latest.json
            build/SHA256SUMS.txt

      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::release $TAG is already published; refusing to overwrite its assets"
            exit 1
          fi

          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag $prerelease \
              --title "$TAG" --notes "$(git cliff --latest --strip all)" --draft
          for f in build/*; do
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --clobber
          done
