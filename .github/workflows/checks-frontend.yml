name: frontend

on:
  push:
    branches: [main, dev, "release/**", "hotfix/**"]
    paths:
      - "kursal-tauri/**"
      - "!kursal-tauri/src-tauri/**"
      - "locales/**"
      - "bin/checkTranslations.ts"
      - "justfile"
      - ".github/workflows/checks-frontend.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install deps
        working-directory: kursal-tauri
        run: bun install --frozen-lockfile
      - run: just check-frontend "${{ github.ref == 'refs/heads/main' && '--strict' || '' }}"
