[package]
name = "kursal-core"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gen_api_docs"
path = "src/bin/gen_api_docs.rs"
required-features = ["apiserver"]

[features]
default = ["calls", "ble"]
calls = [
    "dep:audiopus",
    "dep:cpal",
    "dep:ringbuf",
    "dep:webrtc-audio-processing",
    "dep:objc2-avf-audio",
    "dep:objc2",
    "dep:dispatch2",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-av-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-video-toolbox",
    "dep:objc2-ui-kit",
]
ble = ["dep:btleplug", "dep:ble-peripheral-rust"]
apiserver = ["dep:axum", "dep:tower-http"]
api-docs = ["apiserver", "dep:utoipa-scalar"]

[dependencies]
# Async
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# Errors & logging
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
log4rs = { workspace = true }

# Crypto
argon2 = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
blake2 = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
libsignal-protocol = { workspace = true }
pqcrypto-dilithium = { workspace = true }
pqcrypto-traits = { workspace = true }

# Network
libp2p = { workspace = true, features = ["mdns"] }
libp2p-stream = { workspace = true }
btleplug = { workspace = true, optional = true }

# Storage
redb = { workspace = true }
keyring-core = { workspace = true }

# API
axum = { workspace = true, features = ["ws"], optional = true }
tower-http = { workspace = true, features = ["cors"], optional = true }
utoipa = { workspace = true }
utoipa-scalar = { workspace = true, features = ["axum"], optional = true }

# Audio
audiopus = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
ringbuf = { workspace = true, optional = true }

# Stats
sysinfo = { workspace = true, features = ["system"] }
prometheus-client = { workspace = true }

# Misc
clap = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v7"] }
emojis = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
dirs = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
ble-peripheral-rust = { workspace = true, optional = true }

# Echo cancellation / noise suppression (software AEC3 + NS). Its bundled
# C++/meson build does NOT cross-compile, so we only enable it where the
# build is native
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
webrtc-audio-processing = { workspace = true, features = ["bundled"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = [
    "keychain",
    "protected",
] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["protected"] }
objc2-ui-kit = { workspace = true, optional = true, features = [
    "UIDevice",
    "UIOrientation",
] }
# Configure the audio session for VoIP: hardware echo-cancel/noise-suppression
# and (with UIBackgroundModes=audio) keeping an active call alive in background.
objc2-avf-audio = { workspace = true, optional = true, features = [
    "AVAudioSession",
    "AVAudioSessionTypes",
] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { workspace = true, optional = true }
dispatch2 = { version = "0.3.1", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "CFBase",
    "CFNumber",
    "CFString",
    "CFDictionary",
    "CFArray",
] }
objc2-foundation = { workspace = true, optional = true, features = [
    "NSArray",
    "NSString",
    "NSEnumerator",
] }
objc2-av-foundation = { workspace = true, optional = true, features = [
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureVideoDataOutput",
    "AVCaptureSessionPreset",
    "AVMediaFormat",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-media = { workspace = true, optional = true, features = [
    "CMSampleBuffer",
    "CMFormatDescription",
    "CMTime",
    "CMBlockBuffer",
    "objc2-core-video",
] }
objc2-core-video = { workspace = true, optional = true, features = [
    "CVPixelBuffer",
    "CVImageBuffer",
    "CVBuffer",
] }
objc2-video-toolbox = { workspace = true, optional = true, features = [
    "VTCompressionSession",
    "VTCompressionProperties",
    "VTSession",
    "VTErrors",
    "block2",
    "objc2-core-media",
    "objc2-core-video",
] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { workspace = true }
ndk-context = "0.1.1"
jni = "0.19.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Storage_FileSystem",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
openh264 = { workspace = true }
openh264-sys2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = { workspace = true }
openh264 = { workspace = true }
openh264-sys2 = { workspace = true }
zune-jpeg = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
dbus-secret-service-keyring-store = { workspace = true, features = [
    "crypto-rust",
    "vendored",
] }