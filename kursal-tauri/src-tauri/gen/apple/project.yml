name: kursal-app
options:
  bundleIdPrefix: chat.kursal
  deploymentTarget:
    iOS: 15.6
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Kursal
      PRODUCT_BUNDLE_IDENTIFIER: chat.kursal
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  kursal-app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
        excludes:
          - "**/debug/**"
      - path: kursal-app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    # No `info:` block because xcodegen regenerates that file
    entitlements:
      path: kursal-app_iOS/kursal-app_iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.chat.kursal
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        INFOPLIST_FILE: kursal-app_iOS/Info.plist
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: KursalShare
        embed: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: WebKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
    preBuildScripts:
      - script: |
          export OPUS_NO_PKG=1 OPUS_STATIC=1
          if [ "${PLATFORM_NAME:-}" = "iphonesimulator" ]; then
            export OPUS_LIB_DIR="$SRCROOT/../../../../bin/deps/ios-sim-arm64"
          else
            export OPUS_LIB_DIR="$SRCROOT/../../../../bin/deps/ios-arm64"
          fi
          bun tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

  KursalShare:
    type: app-extension
    platform: iOS
    sources:
      - path: KursalShare
    info:
      path: KursalShare/Info.plist
      properties:
        CFBundleDisplayName: Kursal
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: KursalShare/KursalShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.chat.kursal
    settings:
      base:
        PRODUCT_NAME: KursalShare
        PRODUCT_BUNDLE_IDENTIFIER: chat.kursal.share
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: [arm64]
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: false
    dependencies:
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework