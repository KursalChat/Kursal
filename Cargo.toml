[workspace]
members = ["kursal-cli", "kursal-core", "kursal-tauri/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.6"
authors = ["Kodeur_Kubik <kubik@kursal.chat>", "Arlo <arlo@kursal.chat>"]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.88"                                                     # lets keep it the same as libsignal
homepage = "https://kursal.chat"
repository = "https://github.com/KursalChat/Kursal"

[workspace.lints.clippy]
cast_possible_truncation = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fuzzing)',
    'cfg(tokio_unstable)',
] }

[workspace.dependencies]
# Crypto
aes-gcm = "0.11.0"
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3.5"

# Network
libp2p = { version = "0.56.0", features = [
    "tcp",
    "dns",
    "quic",
    "relay",
    "dcutr",
    "kad",
    "mdns",
    "noise",
    "yamux",
    "identify",
    "ping",
    "tokio",
    "macros",
    "request-response",
    "metrics",
] }
libp2p-stream = "0.4.0-alpha"
btleplug = { version = "0.12.0", features = ["serde"] }
ble-peripheral-rust = "0.2.0"

# Storage
redb = "4.1.0"
keyring-core = "1.0.0"
dirs = "6.0.0"
android-native-keyring-store = "1.0.0"
apple-native-keyring-store = "1.0.0"
windows-native-keyring-store = "1.0.0"
dbus-secret-service-keyring-store = "1.0.0"

# API
axum = "0.8.9"
tower-http = "0.7.0"
utoipa = "5.5.0"
utoipa-scalar = "0.3.0"

# Audio
audiopus = "0.2.0"
cpal = "0.18.1"
ringbuf = "0.5.1"
webrtc-audio-processing = "2.1.0"
objc2-avf-audio = "0.3.2"

# Stats
sysinfo = { version = "0.39.6", default-features = false }
prometheus-client = "0.23.1"                               # MUST match the version libp2p-metrics uses

# CLI
toml = "1.1.4"
ratatui = "0.30.2"

# Logging & telemetry
log4rs = { version = "1.4.0", features = ["gzip"] }
sentry = { version = "0.49.0", default-features = false, features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "reqwest",
    "rustls",
] }
sentry-panic = "0.49.0"

# Platform
objc2-foundation = { version = "0.3.2", default-features = false }
webview2-com = "0.38.2"
windows = "0.61.3"

# Misc
emojis = "0.9.0"

# Tauri
tauri-build = "2.6.3"
tauri = "2.11.5"

tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-os = "2.3.2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.4.3"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-barcode-scanner = "2.4.5"
tauri-plugin-biometric = "2.3.2"
tauri-plugin-haptics = "2.3.2"

tauri-plugin-sharekit = "=0.4.0-rc.5"

# libsignal deps - from https://github.com/signalapp/libsignal/blob/main/Cargo.toml
libsignal-protocol = { path = "externals/libsignal/rust/protocol" }
libsignal-core = { path = "externals/libsignal/rust/core" }
libsignal-debug = { path = "externals/libsignal/rust/debug" }
signal-crypto = { path = "externals/libsignal/rust/crypto" }

boring-signal = { git = "https://github.com/signalapp/boring", tag = "signal-v5.0.2", package = "boring", default-features = false }
spqr = { git = "https://github.com/signalapp/SparsePostQuantumRatchet.git", tag = "v1.5.3" }
tokio-boring-signal = { git = "https://github.com/signalapp/boring", tag = "signal-v5.0.2", package = "tokio-boring" }

aes = "0.9.1"
aes-gcm-siv = "0.11.1"
anyhow = "1.0.97"
arbitrary = "1.4.2"
argon2 = "0.5.0"
arrayvec = "0.7.4"
asn1 = "0.24.1"
assert_cmd = "2.0.13"
assert_matches = "1.5"
async-compression = "0.4.5"
async-trait = "0.1.79"
atomic-take = "1.1.0"
auto_enums = "0.8.7"
backtrace = "0.3.76"
base64 = "0.22.1"
bincode = "1.3.2"
bitflags = "2.9"
bitstream-io = "1.10.0"
blake2 = "0.10.6"
boring = { version = "5.0", default-features = false }
boring-sys = { version = "5.0", default-features = false }
bytes = "1.11.1"
cbc = "0.2.1"
cfg-if = "1.0.0"
chacha20poly1305 = "0.11.0"
chrono = "0.4.42"
clap = "4.4.11"
clap-stdin = "0.8.0"
const-str = "1.0"
criterion = "0.5"
ctr = "0.10.1"
curve25519-dalek = "5.0"
data-encoding-macro = "0.1.18"
derive-where = "1.6.1"
derive_more = "2.0.0"
dir-test = "0.4.1"
displaydoc = "0.2.5"
ed25519-dalek = "3.0"
either = "1.13.0"
env_logger = "0.11.7"
flate2 = { version = "1.1.1", default-features = false }
futures = "0.3"
futures-util = "0.3"
ghash = "0.6.0"
heck = "0.5"
hex = "0.4.3"
hickory-proto = "0.26.1"
hkdf = "0.13.0"
hmac = "0.13.0"
hpke-rs = "0.7"
hpke-rs-crypto = "0.7"
http = "1.3.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = "1.7"
hyper-util = "0.1.17"
indexmap = "2.7.0"
intmap = "3.1.2"
itertools = "0.15.0"
jni = "0.22.4"
libc = "0.2.186"
libcrux-ml-kem = { version = "0.0.10", default-features = false }
linkme = "0.3.33"
log = "0.4.21"
macro_rules_attribute = "0.2.0"
mediasan-common = "0.5.3"
minidump = { version = "0.22.1", default-features = false }
minidump-processor = { version = "0.22.1", default-features = false }
minidump-unwind = { version = "0.22.1", default-features = false }
minijinja = "2.19.0"
mp4san = "0.5.3"
neon = { version = "1.1.0", default-features = false }
nonzero_ext = "0.3.0"
once_cell = "1.20.0"
partial-default = "0.1.0"
password-hash = { version = "0.5.0" }
paste = "1.0.15"
pbjson = "0.9.0"
pbjson-build = "0.9.0"
pbjson-types = "0.9.0"
pin-project = "1.1.5"
pretty_assertions = "1.4.0"
proc-macro2 = "1.0.93"
proptest = "1.7"
proptest-arbitrary-interop = "0.1.0"
proptest-state-machine = "0.4"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protobuf = "3.7.2"
protobuf-codegen = "3.7.2"
quote = "1.0.40"
rand = "0.9.4"
rand_chacha = "0.9"
rand_core = "0.9"
rangemap = "1.5.1"
rayon = "1.8.0"
rcgen = "0.14.0"
ref-cast = "1.0.25"
rustls = { version = "0.23.25", default-features = false }
rustls-platform-verifier = "0.5.1"
scopeguard = "1.0"
serde = "1.0.203"
serde_json = "1.0.45"
serde_json5 = "0.2.1"
serde_with = "3.1.0"
sha1 = "0.11"
sha2 = "0.11"
simd_cesu8 = "1.1.1"
snow = { version = "0.10", default-features = false }
socks5-server = "0.10.1"
static_assertions = "1.1"
strum = "0.28.0"
subtle = "2.6"
syn = "2.0.98"
syn-mid = "0.6"
test-case = "3.3"
test-log = "0.2.16"
testing_logger = "0.1.1"
thiserror = "2.0.11"
tls-parser = "0.12.2"
tokio = "1.52.2"
tokio-socks = "0.5.2"
tokio-stream = "0.1.16"
tokio-tungstenite = "0.29.0"
tokio-util = "0.7.18"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false }
tower-service = "0.3.3"
tungstenite = "0.29.0"
unicode-segmentation = "1.12.0"
url = "2.5.4"
uuid = "1.5"
visibility = "0.1.1"
warp = "0.4.2"
webpsan = { version = "0.5.3", default-features = false }
x25519-dalek = "3.0"
zerocopy = "0.8.33"
zeroize = "1.8.2"

[patch.crates-io]
boring = { git = 'https://github.com/signalapp/boring', tag = "signal-v5.0.2" }
boring-sys = { git = 'https://github.com/signalapp/boring', tag = "signal-v5.0.2" }

ble-peripheral-rust = { path = "externals/ble-peripheral-rust" }

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
overflow-checks = false
panic = "unwind"
codegen-units = 1       # LLVM better optimization
lto = true              # Enable link time optimizations
opt-level = 3           # Optimize for binary speed
strip = true            # Remove debug symbols

[profile.release.package.curve25519-dalek]
overflow-checks = false

[profile.release.package.sha2]
overflow-checks = false

[profile.release.package.hmac]
overflow-checks = false

[profile.dev]
incremental = true
